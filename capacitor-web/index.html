<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f1e8">
    <title>Sourashtra Chef</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f7f1e8;
        color: #1f2937;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }

      main {
        max-width: 24rem;
        padding: 2rem;
      }

      h1 {
        background: linear-gradient(135deg, #2b7a78, #5c9dad);
        background-clip: text;
        color: transparent;
      }

      p {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sourashtra Chef</h1>
      <p>Connect to the internet to open your fridge inventory.</p>
    </main>
  </body>
</html>
