<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0f1a">
    <title>Fridge AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0d0f1a;
        color: #f1f5f9;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }

      main {
        max-width: 24rem;
        padding: 2rem;
      }

      h1 {
        background: linear-gradient(135deg, #06b6d4, #6366f1);
        background-clip: text;
        color: transparent;
      }

      p {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fridge AI</h1>
      <p>Connect to the internet to open your fridge inventory.</p>
    </main>
  </body>
</html>
