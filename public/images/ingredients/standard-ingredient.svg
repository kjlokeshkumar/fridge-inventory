<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Soft porcelain ambient drop shadow -->
    <filter id="plateShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1f1a17" flood-opacity="0.18" />
    </filter>
    
    <!-- Warm ceramic porcelain bowl gradient -->
    <linearGradient id="porcelainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f3ede2" />
    </linearGradient>

    <!-- Artisanal teal/bronze outer rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6e77" />
      <stop offset="50%" stop-color="#1b4950" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Warm inner depth shadow -->
    <radialGradient id="innerDepth" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f5ede0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e6dbc8" stop-opacity="1" />
    </radialGradient>

    <!-- Golden accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Fresh herbs green gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>

  <!-- Outer Plate Rim -->
  <circle cx="60" cy="60" r="56" fill="url(#porcelainGrad)" stroke="url(#rimGrad)" stroke-width="2.5" filter="url(#plateShadow)" />

  <!-- Inner Recessed Well / Ramekin Bowl -->
  <circle cx="60" cy="60" r="45" fill="url(#innerDepth)" stroke="rgba(45, 110, 119, 0.18)" stroke-width="1.5" />
  
  <!-- Fine Decorative Concentric Ring -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="rgba(180, 83, 9, 0.22)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Artisanal Cloche & Fresh Culinary Produce Silhouette -->
  <!-- Cloche Dome Base -->
  <path d="M 38 67 C 38 47, 82 47, 82 67 Z" fill="#2d6e77" fill-opacity="0.12" stroke="#2d6e77" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Cloche Handle Knob -->
  <circle cx="60" cy="46" r="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1" />
  
  <!-- Serving Platter Line -->
  <path d="M 32 68 L 88 68" stroke="#2d6e77" stroke-width="2.5" stroke-linecap="round" />

  <!-- Fresh Organic Herb Leaves (Right Branch) -->
  <path d="M 60 62 C 65 55, 78 54, 76 62 C 73 66, 64 64, 60 62 Z" fill="url(#leafGrad)" opacity="0.9" />
  <!-- Left Sprout Leaf -->
  <path d="M 60 62 C 55 56, 44 57, 46 63 C 48 67, 56 64, 60 62 Z" fill="url(#leafGrad)" opacity="0.85" />
  <!-- Center Sprout -->
  <path d="M 60 64 L 60 56" stroke="#15803d" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Spice Grains / Pepper Specks -->
  <circle cx="48" cy="74" r="1.5" fill="#78350f" opacity="0.65" />
  <circle cx="54" cy="75" r="1.2" fill="#b45309" opacity="0.75" />
  <circle cx="60" cy="76" r="1.5" fill="#2d6e77" opacity="0.65" />
  <circle cx="66" cy="75" r="1.2" fill="#78350f" opacity="0.7" />
  <circle cx="72" cy="74" r="1.5" fill="#b45309" opacity="0.65" />
</svg>
